<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let m1 = Number(window.prompt('Digita um numero!'))
        let m2 = Number(window.prompt('Digita outro numero!'))
        let s = m1 + m2
        window.document.write('a soma dos valores e ' + s )

        var nome = window.prompt('qual e o seu nome?')
        document.write(`ola ${nome} seu nome tem ${nome.length} <br>`)
        document.write(`seu nome em maisculas e ${nome.toLocaleUpperCase()} <br>`)
        document.write(`seu nome em minusculas e ${nome.toLocaleLowerCase()} <br>`)


    </script>
</body>
</html
